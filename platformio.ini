; Examples for Lilka v2 extension modules. Each example lives next to its module's README.
;   pio run -e lora_sx1262 -t upload   -> modules/003_lora
;   pio run -e rf_nrf24    -t upload   -> modules/004_rf/nrf24
;   pio run -e rf_cc1101   -t upload   -> modules/004_rf/cc1101
;   pio run -e gyro_magnet -t upload   -> modules/006_gyro_magnet
[platformio]
src_dir = modules
default_envs = lora_sx1262, rf_nrf24, rf_cc1101, gyro_magnet

[env]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

[env:lora_sx1262]
build_src_filter = +<003_lora/*.cpp>

[env:rf_nrf24]
build_src_filter = +<004_rf/nrf24/*.cpp>

[env:rf_cc1101]
build_src_filter = +<004_rf/cc1101/*.cpp>

[env:gyro_magnet]
build_src_filter = +<006_gyro_magnet/*.cpp>
